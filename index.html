<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tap-to-Tick | Jogo de Palavras</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="jogo">
      <h1>Encontre a Palavra</h1>

      <p id="instrucao">Toque na palavra: <strong>gato</strong></p>

      <div class="frase" id="frase"></div>

      <p id="mensagem" aria-live="polite"></p>

      <p id="pontuacao">Rodada 1 de 4</p>

      <button id="proximo" hidden>Próxima rodada</button>
    </main>
  </body>
</html>
